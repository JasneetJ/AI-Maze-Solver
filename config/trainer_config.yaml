behaviors:
  MazeAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.03
        encoding_size: 64
        learning_rate: 1.0e-4
    max_steps: 50000000
    time_horizon: 256
    summary_freq: 5000
    keep_checkpoints: 10
    checkpoint_interval: 100000

environment_parameters:
  maze_size:
    curriculum:
      - name: Lesson0_EmptyRoom
        completion_criteria: {measure: reward, behavior: MazeAgent, signal_smoothing: true, min_lesson_length: 100, threshold: 0.8}
